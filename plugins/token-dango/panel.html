<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 团子</title>
<style>
/* 宿主会通过 hostContext.styles.variables 传入整套变量，这里只是兜底值 */
:root{
  --color-background-primary:#fff; --color-background-tertiary:#f5f5f5;
  --color-text-primary:#0d0d0d; --color-text-secondary:rgba(13,13,13,.65); --color-text-tertiary:rgba(13,13,13,.5);
  --color-border-secondary:rgba(13,13,13,.08);
  --color-text-success:#00a240; --color-text-warning:#e25507; --color-text-danger:#e02e2a;
  --font-sans:-apple-system,system-ui,"PingFang SC",sans-serif;
  --border-radius-md:10px;
  --track:rgba(13,13,13,.07);
}
:root[data-theme="dark"]{
  --color-background-primary:#212121; --color-background-tertiary:#2a2a2a;
  --color-text-primary:#ececec; --color-text-secondary:rgba(236,236,236,.7); --color-text-tertiary:rgba(236,236,236,.5);
  --color-border-secondary:rgba(255,255,255,.08); --track:rgba(255,255,255,.09);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--color-background-primary);color:var(--color-text-primary);
  font:14px/1.5 var(--font-sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:400px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--color-text-tertiary);font-size:12.5px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.head .t{min-width:0;display:flex;flex-direction:column}
.head .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;padding:2px 10px;border-radius:999px;background:var(--color-background-tertiary);color:var(--color-text-secondary)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.run{color:var(--color-text-success)} .chip.run i{animation:pulse 1.4s ease-in-out infinite}
.chip.full{color:var(--color-text-danger)}
@keyframes pulse{50%{opacity:.25}}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 0}
.big{font-size:40px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.note{font-size:12.5px;color:var(--color-text-danger)}
.pair{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sub2{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.grid .h{grid-column:1/-1;color:var(--color-text-secondary);margin-top:8px}
.pair div{display:flex;flex-direction:column;gap:1px}
.v{font-size:17px;font-weight:600}
.sec{border-top:1px solid var(--color-border-secondary);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lab{color:var(--color-text-secondary)}
.track{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;color:var(--color-text-secondary)}
details summary::-webkit-details-marker{display:none}
details summary svg{transition:transform .2s}
details[open] summary svg{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:13px}
.grid .l{color:var(--color-text-tertiary)} .grid .r{text-align:right} .grid .sub{padding-left:14px}
.foot{display:flex;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--color-text-secondary);font-size:13px;max-width:28ch;margin:0 auto}
summary:focus-visible{outline:2px solid var(--color-text-success);outline-offset:3px;border-radius:4px}

.mascot .wave{animation:none}
.mascot.working .wave{animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(-28px)}}
.mascot .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .zz{animation:float 2.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-3px);opacity:.4}}
.mascot .spark{transform-box:fill-box;transform-origin:center;animation:spark 1.8s ease-in-out infinite}
@keyframes spark{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
.mascot .drop{animation:drip 2s ease-in infinite}
@keyframes drip{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(4px);opacity:0}}
@media (prefers-reduced-motion:reduce){.mascot *,.chip i{animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const POLL_MS = 2500;
  let threadId = null, snap = null, lastOk = 0, detailsOpen = false, timer = null;

  // ---------- 小工具 ----------
  const k = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const secs = ms => ms == null ? '—' : ms < 60000 ? (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + ' 秒' : Math.floor(ms / 60000) + ' 分 ' + Math.round(ms % 60000 / 1000) + ' 秒';
  const clock = d => d.toLocaleString('zh-CN', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
  const hm = d => d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
  const ago = ms => ms < 5000 ? '刚刚' : ms < 60000 ? Math.round(ms / 1000) + ' 秒前' : Math.round(ms / 60000) + ' 分钟前';
  const level = p => p >= .8 ? 'var(--color-text-danger)' : p >= .6 ? '#e6a23c' : '#5aa76d';
  const usd = c => !c ? '—' : c.usd < 0.01 ? '<$0.01' : '$' + c.usd.toFixed(c.usd < 100 ? 2 : 0);
  const TIER = {fast: 'Fast 档', standard: '标准档'};

  // ---------- 团子：肚子是上下文液面，表情是状态 ----------
  function dango(state, p, size) {
    const y = 50 - Math.max(0, Math.min(1, p)) * 42;
    let wave = 'M-56 0';
    for (let i = 0; i < 12; i++) wave += ' q7 -3 14 0 q7 3 14 0';
    wave += ' V60 H-56 Z';
    const liq = p >= .8 ? '#f29a85' : p >= .6 ? '#f2c46b' : '#9fd3a9';
    const ink = '#2c2f2c';
    const eyes = {
      working: `<ellipse class="eye-open" cx="21" cy="30" rx="1.9" ry="2.5" fill="${ink}"/><ellipse class="eye-open" cx="35" cy="30" rx="1.9" ry="2.5" fill="${ink}"/><path d="M25.5 35.2q2.5 2.4 5 0" stroke="${ink}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`,
      idle: `<path d="M18.5 30q2.5 2.2 5 0M32.5 30q2.5 2.2 5 0" stroke="${ink}" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M26.5 35.6h3" stroke="${ink}" stroke-width="1.5" stroke-linecap="round"/>`,
      full: `<path d="M19 28l3.2 2-3.2 2M37 28l-3.2 2 3.2 2" stroke="${ink}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M24.5 36.2q1.75-1.6 3.5 0t3.5 0" stroke="${ink}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`,
      waiting: `<circle cx="21" cy="30" r="1.6" fill="${ink}"/><circle cx="35" cy="30" r="1.6" fill="${ink}"/><circle cx="28" cy="36" r="1.6" fill="none" stroke="${ink}" stroke-width="1.4"/>`
    }[state];
    const extra = {
      working: `<path class="spark" d="M48 9l1.2 2.8 2.8 1.2-2.8 1.2L48 17l-1.2-2.8-2.8-1.2 2.8-1.2z" fill="#f2c46b"/>`,
      idle: `<g class="zz" fill="#8a948b" font-family="sans-serif" font-weight="700"><text x="44" y="14" font-size="8">z</text><text x="50" y="7" font-size="6">z</text></g>`,
      full: `<path class="drop" d="M47 16c2 3 3 4.6 3 6a3 3 0 01-6 0c0-1.4 1-3 3-6z" fill="#8fc3ec"/>`,
      waiting: `<text x="45" y="14" font-size="11" font-weight="700" fill="#8a948b" font-family="sans-serif">?</text>`
    }[state];
    const body = 'M28 9C41.5 9 50 18.5 50 32c0 12-9 18-22 18S6 44 6 32C6 18.5 14.5 9 28 9z';
    return `<svg class="mascot ${state}" width="${size}" height="${size}" viewBox="-4 -6 64 64" role="img" aria-label="团子">
      <defs><clipPath id="belly"><path d="${body}"/></clipPath></defs>
      <path d="${body}" fill="#fffaf2"/>
      <g clip-path="url(#belly)"><g transform="translate(0 ${y.toFixed(1)})"><path class="wave" d="${wave}" fill="${liq}" opacity=".9"/></g></g>
      <path d="${body}" fill="none" stroke="#3a3f3a" stroke-width="1.6"/>
      <path d="M28 9c0-3.6 2.6-6.2 6.6-6.2-.2 3.7-2.7 6.2-6.6 6.2z" fill="#6fae7e" stroke="#3a3f3a" stroke-width="1.2" stroke-linejoin="round"/>
      <ellipse cx="15.5" cy="35" rx="3" ry="1.8" fill="#f4a3a0" opacity=".55"/><ellipse cx="40.5" cy="35" rx="3" ry="1.8" fill="#f4a3a0" opacity=".55"/>
      ${eyes}${extra}</svg>`;
  }

  function quotaName(m) {
    if (m === 300) return '5 小时额度';
    if (m === 10080) return '本周额度';
    if (m % 1440 === 0) return (m / 1440) + ' 天额度';
    return Math.round(m / 60) + ' 小时额度';
  }

  // ---------- 渲染 ----------
  function render() {
    const s = snap;
    if (!s) { app.innerHTML = `<div class="hero">${dango('waiting', 0, 112)}<p class="empty">正在找这条会话的用量记录…</p></div>`; return; }
    if (s.status === 'unreadable') {
      app.innerHTML = `<div class="head"><div class="t"><span class="n">${esc(s.title || '这条会话')}</span></div><span class="chip">读不到</span></div>
        <div class="hero">${dango('waiting', 0, 112)}<p class="empty">${esc(s.reason || '暂时读不到这条会话的日志')}。团子会继续尝试。</p></div>`;
      return;
    }
    const ok = s.status === 'ok';
    const used = ok && s.last ? s.last.total_tokens : null;
    const win = ok ? s.window : null;
    const p = used != null && win ? used / win : 0;
    const running = !!(s.turn && s.turn.running);
    const face = !ok ? 'waiting' : p >= .8 ? 'full' : running ? 'working' : 'idle';
    const chip = !ok ? '<span class="chip">等待记录</span>'
      : running ? '<span class="chip run"><i></i>生成中</span>'
      : p >= .8 ? '<span class="chip full"><i></i>快满了</span>'
      : '<span class="chip"><i></i>空闲</span>';
    const t = s.total || {};
    const cache = t.input_tokens ? (t.cached_input_tokens / t.input_tokens * 100).toFixed(1) + '%' : '—';

    let quota = '';
    if (s.quota && s.quota.windows.length) {
      const asOf = s.quota.as_of ? '截至 ' + hm(new Date(s.quota.as_of)) : '';
      quota = s.quota.windows.map(w => {
        const pct = Math.max(0, Math.min(100, w.used_percent));
        const reset = w.resets_at ? clock(new Date(w.resets_at * 1000)) + ' 重置' : '';
        return `<div class="sec"><div class="row"><span class="lab">${quotaName(w.window_minutes)}</span><span class="v" style="font-size:14px">已用 ${Math.round(pct)}%</span></div>
          <div class="track"><i style="width:${pct}%;background:${level(pct / 100)}"></i></div>
          <div class="row muted"><span>${reset}</span><span>${asOf}</span></div></div>`;
      }).join('');
    }

    let turn = '';
    if (s.turn) {
      const tn = s.turn, u = tn.usage;
      const extra = [
        tn.tps != null ? `<span title="本轮输出 ÷ 扣掉工具执行后的时间；含首字等待和推理">约 ${Math.round(tn.tps)} tok/s</span>` : '',
        tn.cost ? `<span title="按 API 价格折算，不是订阅的实际账单">折算 ${usd(tn.cost)}</span>` : ''
      ].filter(Boolean).join('<span>·</span>');
      turn = `<div class="row"><span class="lab">${running ? '本轮' : '上一轮'}</span>
          <span>${running ? '已进行 ' + secs(tn.elapsed_ms) : secs(tn.duration_ms)}${u ? ' · 输出 ' + k(u.output_tokens) : ''}</span></div>
        ${extra ? `<div class="sub2 muted">${extra}</div>` : ''}`;
    }
    const c = ok ? s.cost : null;
    const costNote = !c ? '' : `${TIER[c.tier] || c.tier} · ${esc((c.checked || '').slice(5))} 官网价`;

    const detail = ok ? `<details class="sec" ${detailsOpen ? 'open' : ''} id="det">
        <summary><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5l3.5 3.5L3 8.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>明细</summary>
        <div class="grid">
          <span class="l">输入</span><span class="r">${k(t.input_tokens)}</span>
          <span class="l sub">其中缓存</span><span class="r">${k(t.cached_input_tokens)}</span>
          <span class="l">输出</span><span class="r">${k(t.output_tokens)}</span>
          <span class="l sub">其中推理</span><span class="r">${k(t.reasoning_output_tokens)}</span>
          <span class="l">最近一次请求</span><span class="r">${k(used)}</span>
          ${s.turn && !running && s.turn.ttft_ms != null ? `<span class="l">上一轮首字</span><span class="r">${secs(s.turn.ttft_ms)}</span>` : ''}
          ${s.turn && s.turn.model_ms != null ? `<span class="l">${running ? '本轮' : '上一轮'}模型 / 工具</span><span class="r">${secs(s.turn.model_ms)} / ${secs(s.turn.tool_ms)}</span>` : ''}
          ${c ? `<span class="h">按 API 价格折算（不是订阅的实际账单）</span>
          <span class="l">未缓存输入</span><span class="r">${usd({usd: c.parts.input})}</span>
          <span class="l">缓存输入</span><span class="r">${usd({usd: c.parts.cached})}</span>
          <span class="l">输出（含推理）</span><span class="r">${usd({usd: c.parts.output})}</span>
          ${c.parts.write ? `<span class="l">缓存写入</span><span class="r">${usd({usd: c.parts.write})}</span>` : ''}
          <span class="l">价格</span><span class="r">${costNote}</span>
          ${c.basis === 'totals' ? '<span class="l">算法</span><span class="r">老会话没有逐次记录，按累计数粗估，偏低</span>' : ''}` : ''}
          <span class="l">模型</span><span class="r">${esc(s.model || '—')}</span>
          <span class="l">统计时间</span><span class="r">${s.sampled_at ? hm(new Date(s.sampled_at)) : '—'}</span>
        </div></details>` : '';

    app.innerHTML = `
      <div class="head"><div class="t"><span class="n" title="${esc(s.title)}">${esc(s.title)}</span>
        <span class="muted">${s.mode === 'thread' ? '当前会话' : '最近活动的会话'}</span></div>${chip}</div>
      <div class="hero">${dango(face, p, 112)}
        <span class="big">${ok && win ? Math.round(p * 100) + '%' : '—'}</span>
        <span class="muted">${ok && win ? `上下文 · ${k(used)} / ${k(win)} · 剩 ${k(win - used)}` : '这条会话还没有用量记录'}</span>
        ${p >= .8 ? '<span class="note">快满了，下一轮可能触发压缩</span>' : ''}
      </div>
      ${ok ? `<div class="pair"><div><span class="muted">会话 Token</span><span class="v">${k(t.total_tokens)}</span></div>
        <div><span class="muted">缓存命中</span><span class="v">${cache}</span></div>
        <div title="${c ? '按 API 价格折算，不是订阅的实际账单' : '价格表里没有这个模型'}"><span class="muted">折算花费</span><span class="v">${usd(c)}</span></div></div>` : ''}
      ${turn ? `<div class="sec">${turn}</div>` : ''}
      ${quota}
      ${detail}
      <div class="foot muted"><span>本机日志</span><span id="fresh">${lastOk ? ago(Date.now() - lastOk) + '更新' : ''}</span></div>`;
    const det = document.getElementById('det');
    if (det) det.addEventListener('toggle', () => { detailsOpen = det.open; });
  }

  let lastKey = '';
  function apply(out) {
    if (!out || !out.snapshot) return;
    lastOk = Date.now();
    const s = out.snapshot;
    if (!threadId && s.mode === 'thread') threadId = s.thread_id;
    // 生成中的已用时长每次都变，按 10 秒取整，免得整块重画打断动画和点击
    const key = JSON.stringify(s, (k, v) => k === 'elapsed_ms' ? Math.floor(v / 10000) : v);
    if (key === lastKey) return;
    lastKey = key; snap = s;
    render();
  }

  // ---------- 宿主主题与样式 ----------
  function applyHost(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [name, val] of Object.entries(vars)) document.documentElement.style.setProperty(name, val);
  }

  // ---------- MCP Apps 通道（window.openai 不在时使用） ----------
  let nid = 1; const pending = new Map();
  function rpc(method, params) {
    const id = nid++;
    window.parent.postMessage({jsonrpc: '2.0', id, method, params}, '*');
    return new Promise((res, rej) => {
      pending.set(id, {res, rej});
      setTimeout(() => { if (pending.delete(id)) rej(new Error('timeout')); }, 8000);
    });
  }
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && !m.method && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.rej(new Error(m.error.message)) : p.res(m.result); return;
    }
    if (m.method === 'ui/notifications/tool-result' && m.params) apply(m.params.structuredContent);
    if (m.method === 'ui/notifications/host-context-changed') { applyHost(m.params); render(); }
    if (m.method && m.id != null) window.parent.postMessage({jsonrpc: '2.0', id: m.id, result: {}}, '*');
  });

  async function fetchSnapshot() {
    const args = threadId ? {thread_id: threadId} : {};
    if (window.openai && window.openai.callTool) {
      const r = await window.openai.callTool('token_dango_snapshot', args);
      return r && (r.structuredContent || (r.result && r.result.structuredContent));
    }
    const r = await rpc('tools/call', {name: 'token_dango_snapshot', arguments: args});
    return r && r.structuredContent;
  }

  async function poll() {
    try { apply(await fetchSnapshot()); } catch (e) { /* 下一轮再试 */ }
    const f = document.getElementById('fresh');
    if (f && lastOk) f.textContent = ago(Date.now() - lastOk) + '更新';
  }
  function schedule() {
    clearInterval(timer);
    if (document.visibilityState === 'visible') { poll(); timer = setInterval(poll, POLL_MS); }
  }
  document.addEventListener('visibilitychange', schedule);

  async function start() {
    render();
    if (window.openai) {
      applyHost({theme: window.openai.theme});
      apply(window.openai.toolOutput);
      window.addEventListener('openai:set_globals', () => { applyHost({theme: window.openai.theme}); apply(window.openai.toolOutput); });
    }
    try {
      const r = await rpc('ui/initialize', {protocolVersion: '2026-01-26', appInfo: {name: 'token-dango', version: '0.2.0'}, appCapabilities: {}});
      applyHost(r && r.hostContext);
      window.parent.postMessage({jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {}}, '*');
    } catch (e) { /* 只有 window.openai 也能工作 */ }
    render();
    schedule();
  }
  start();
})();
</script>
</body>
</html>
